<main class="card login">
  <img class="logo" src="images/logo.png" alt="Mat Kolla" width="132" height="51" />
  <h1>Connexion</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (notice()) {
      <div class="alert is-info" role="status">{{ notice() }}</div>
    }
    @if (error()) {
      <div class="alert is-danger" role="alert">{{ error() }}</div>
    }

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="username" autofocus />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <div class="password">
        <input id="password" class="input" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button class="reveal" type="button" (click)="showPassword.set(!showPassword())">{{ showPassword() ? 'Masquer' : 'Afficher' }}</button>
      </div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="sending()">{{ sending() ? 'Connexion…' : 'Se connecter' }}</button>
  </form>
</main>
