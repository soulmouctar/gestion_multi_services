<!--<c-header class="mb-4 d-print-none" position="sticky">-->
<ng-container>
  <c-container [fluid]="true" class="border-bottom px-3 px-lg-4 app-header-main">
    <button
      [cSidebarToggle]="sidebarId()"
      cHeaderToggler
      class="btn app-header-toggle"
      toggle="visible"
      aria-label="Toggle sidebar navigation"
    >
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>
    <div class="header-spacer"></div>

    <c-header-nav class="ms-auto ms-lg-0 align-items-center app-header-actions">
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
      <ng-container *ngTemplateOutlet="themeDropdown" />
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
      <ng-container *ngTemplateOutlet="userDropdown" />
    </c-header-nav>
  </c-container>
  <c-container *ngIf="userRole === 'SUPER_ADMIN'" [fluid]="true" class="px-3 px-lg-4 py-2 border-bottom header-tenant-bar">
    <div class="header-mobile-tenant d-flex align-items-center gap-2 flex-wrap">
      <label class="small text-muted mb-0">Organisation</label>
      <select class="form-select form-select-sm" [(ngModel)]="selectedManagedTenantId" (change)="onManagedTenantChange()">
        <option [ngValue]="null">Sélectionnez un tenant</option>
        <option *ngFor="let tenant of managedTenants" [ngValue]="tenant.id">{{ tenant.name }}</option>
      </select>
    </div>
  </c-container>
  <c-container [fluid]="true" class="px-3 px-lg-4">
    <c-breadcrumb-router />
  </c-container>
</ng-container>
<!--</c-header>-->

<ng-template #userDropdown>
  <c-dropdown [popperOptions]="{ placement: 'bottom-start' }" variant="nav-item">
    <button [caret]="false" cDropdownToggle class="py-0 pe-0 d-flex align-items-center header-user-toggle" aria-label="Open user menu">
      <div class="d-none d-lg-flex align-items-center me-2">
        <div class="me-3 text-end">
          <div class="fw-semibold text-body">{{ currentUser?.name || 'Utilisateur' }}</div>
          <small class="text-muted">{{ userRoleTitle }}</small>
        </div>
      </div>
      <span class="header-avatar" [class.header-avatar--image]="!!userAvatarUrl">
        <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="Photo de profil" class="header-avatar__image" (error)="onAvatarError()">
        <span *ngIf="!userAvatarUrl" class="header-avatar__fallback">{{ userInitials }}</span>
        <span class="header-avatar__status"></span>
      </span>
    </button>
    <ul cDropdownMenu class="pt-0 w-auto">
      <li>
        <h6 cDropdownHeader class="bg-body-secondary text-body-secondary fw-semibold py-2 rounded-top d-flex align-items-center">
          <span class="header-avatar header-avatar--sm me-2" [class.header-avatar--image]="!!userAvatarUrl">
            <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="Photo de profil" class="header-avatar__image" (error)="onAvatarError()">
            <span *ngIf="!userAvatarUrl" class="header-avatar__fallback">{{ userInitials }}</span>
            <span class="header-avatar__status"></span>
          </span>
          <div>
            <div class="fw-semibold">{{ currentUser?.name || 'Utilisateur' }}</div>
            <small class="text-muted">{{ userRoleTitle }}</small>
          </div>
        </h6>
      </li>
      <li>
        <a cDropdownItem routerLink="/profile">
          <svg cIcon class="me-2" name="cilUser"></svg>
          Mon Profil
        </a>
      </li>
      <li *ngIf="userRole === 'SUPER_ADMIN' || userRole === 'ADMIN'">
        <a cDropdownItem routerLink="/settings">
          <svg cIcon class="me-2" name="cilSettings"></svg>
          Paramètres
        </a>
      </li>
      <li *ngIf="userRole === 'SUPER_ADMIN'">
        <a cDropdownItem routerLink="/admin/users">
          <svg cIcon class="me-2" name="cilPeople"></svg>
          Gestion Utilisateurs
        </a>
      </li>
      <li *ngIf="userRole === 'SUPER_ADMIN'">
        <a cDropdownItem routerLink="/admin/organisations">
          <svg cIcon class="me-2" name="cilApplicationsSettings"></svg>
          Gestion Organisations
        </a>
      </li>
      <li>
        <hr cDropdownDivider />
      </li>
      <!-- <li>
        <a cDropdownItem routerLink="">
          <svg cIcon class="me-2" name="cilFile"></svg>
          Projects
          <c-badge class="ms-2 float-end" color="primary">
            42
          </c-badge>
        </a>
      </li>
      <li>
        <hr cDropdownDivider />
      </li>
      <li>
        <a cDropdownItem routerLink="">
          <svg cIcon class="me-2" name="cilLockLocked"></svg>
          Lock Account
        </a>
      </li> -->
      <li>
        <a cDropdownItem (click)="logout()" style="cursor: pointer;">
          <svg cIcon class="me-2" name="cilAccountLogout"></svg>
          Déconnexion
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Choisir le thème" title="Thème">
      <svg cIcon [name]="icons()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button
          (click)="setColorMode(mode.name)"
          [active]="colorMode()===mode.name"
          cDropdownItem
          class="d-flex align-items-center"
        >
          <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>
