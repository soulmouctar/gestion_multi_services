<div class="login-page">
  <main class="login-card" role="main">
    <img class="login-logo" [src]="logoUrl" alt="Mat-Kolla Multi Services" />

    <h1 class="login-title">Connexion</h1>

    <c-alert *ngIf="successMessage" color="success" [dismissible]="false" class="login-alert">
      {{ successMessage }}
    </c-alert>

    <c-alert *ngIf="errorMessage" color="danger" [dismissible]="false" class="login-alert">
      {{ errorMessage }}
    </c-alert>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Adresse email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          placeholder="exemple@email.com"
          [class.invalid]="submitted && email?.errors" />
        <p class="field-error" *ngIf="submitted && email?.errors">
          <ng-container *ngIf="email?.errors?.['required']">L'email est requis</ng-container>
          <ng-container *ngIf="email?.errors?.['email']">Format d'email invalide</ng-container>
        </p>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-wrap">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            formControlName="password"
            placeholder="••••••••"
            [class.invalid]="submitted && password?.errors" />
          <button
            type="button"
            class="eye"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.6" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5c1.9 0 3.5.5 4.9 1.2M22 12s-3.6 6.5-10 6.5c-1.9 0-3.5-.5-4.9-1.2" />
              <path d="m4 4 16 16" />
            </svg>
          </button>
        </div>
        <p class="field-error" *ngIf="submitted && password?.errors">
          <ng-container *ngIf="password?.errors?.['required']">Le mot de passe est requis</ng-container>
          <ng-container *ngIf="password?.errors?.['minlength']">Minimum 6 caractères</ng-container>
        </p>
      </div>

      <div class="field-row">
        <label class="remember">
          <input type="checkbox" formControlName="remember" />
          <span>Se souvenir de moi</span>
        </label>
        <a routerLink="/auth/forgot-password">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="submit" [disabled]="isLoading">
        <span class="spin" *ngIf="isLoading" aria-hidden="true"></span>
        {{ isLoading ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
  </main>
</div>
